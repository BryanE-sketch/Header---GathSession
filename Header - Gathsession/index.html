<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Header - Gathsession</title>

  </head>
  <body>

    <div class="page">

      <header>
        <figure>
          <img src="img/GathSession.png" alt="Gathsession Logo" srcset="img/GathSession@2x.png 2x"/>
          <figcaption>Gathsession</figcaption>
        </figure>

        <ul class="navegation">
          <li><a href="#">Home</a></li>
          <li><a href="#">Features</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="#">About Us</a></li>
        </ul>
      </header>


        <section class="hero">
          <div class="hero__content">
            <h1>Build your best community starting from here.</h1>
            <p>Meet and communicate with the best people to run projects, 
              events or other activities in a more effective and fun way</p>
          </div>

          <div class="hero__actions">
            <a href="#" class="btn-Get__Started">Get Started</a>
            <a href="#" class="hero__Learn">Learn More</a>
            <img src="img/arrow.png" alt="Arrow icon" class="hero__Arrow">

          </div>
        </section>

        <section class="categories">

          <article>
            <img src="img/icon-1.png" alt="">
            <div class="categories__text">
              <h3>Build  comunity</h3>
            </div>
          </article>

          <article>
            <img src="img/icon-2.png" alt="">
            <div class="categories__text">
              <h3>Share Events</h3>
            </div>
          </article>

          <article>
            <img src="img/icon-3.png" alt="">
            <div class="categories__text">
              <h3>Get information</h3>
            </div>
          </article>
        </section>


        <section class="picture">
        
          <article>
            <img src="img/Picture-profile.png" alt="">
            <div class="profile__5"></div>
          </article>

        </section>

    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
